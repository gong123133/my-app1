<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#173a2b">
<meta name="description" content="野外蛛形动物采集的免提语音记录工具：定位、天气、名录、编号、统计与日报导出。">
<title>蛛迹 · 野外采集记录</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="16" cy="16" r="5.2" fill="currentColor" stroke="none"/>
          <circle cx="16" cy="8.6" r="2.6" fill="currentColor" stroke="none"/>
          <path d="M12 12 6 7M12 15 4 14M12 19 5 22M13 21 9 27M20 12l6-5M20 15l8-1M20 19l7 3M19 21l4 6"/>
        </svg>
      </span>
      <div class="brand-text">
        <h1>蛛迹</h1>
        <p>野外蛛形动物采集记录</p>
      </div>
    </div>
    <div class="status" title="定位与天气状态">
      <span class="status-item"><i class="dot" id="gpsDot"></i><span id="gpsLabel">GPS</span></span>
      <span class="status-item"><i class="dot" id="wxDot"></i><span id="wxLabel">天气</span></span>
    </div>
  </header>

  <main id="main">

    <!-- ================= 采集 ================= -->
    <section class="page active" id="page-collect">
      <div class="hero" id="hero">
        <div class="hero-meta">
          <span class="pill dark" id="sessionState">未开始</span>
          <span class="mono" id="sessionTimer">00:00</span>
        </div>

        <button class="mic" id="micBtn" aria-label="开始或结束采集">
          <span class="mic-ring"></span>
          <svg class="mic-ico" viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <rect x="9" y="3" width="6" height="11" rx="3"/>
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
          </svg>
          <span id="micLabel">开始采集</span>
        </button>
        <div class="hint" id="micHint">点一下开始；也可以说“开始采集”</div>

        <div class="transcript" id="transcript">语音识别的内容会显示在这里</div>

        <form class="cmd" id="cmdForm" autocomplete="off">
          <input id="cmdInput" type="text" placeholder="输入指令，如：横纹金蛛三头" enterkeyhint="send">
          <button type="submit" aria-label="发送">发送</button>
        </form>
      </div>

      <div class="card env">
        <div class="env-grid">
          <div><span class="k">坐标</span><b id="envGeo">定位中…</b></div>
          <div><span class="k">海拔</span><b id="envAlt">—</b></div>
          <div><span class="k">天气</span><b id="envWx">—</b></div>
          <div><span class="k">温 / 湿</span><b id="envTh">—</b></div>
        </div>
        <div class="env-actions">
          <button type="button" class="link" id="geoRetry">重新定位</button>
          <button type="button" class="link" id="wxRetry">更新天气</button>
          <button type="button" class="link" id="envEdit">手动填写</button>
        </div>
      </div>

      <div class="card">
        <div class="row-between"><h3>生境</h3><span class="muted" id="habitatNow"></span></div>
        <div class="chips" id="habitatChips"></div>
        <h3 class="mt">采集方法</h3>
        <div class="chips" id="methodChips"></div>
      </div>

      <button class="btn primary big" id="addBtn">＋ 记录一条</button>

      <div class="card recent">
        <div class="row-between"><h3>刚刚记录</h3><a href="#" data-tab="list">全部 ›</a></div>
        <div id="recentList"></div>
      </div>

      <p class="footnote">数据只保存在这台手机的浏览器里。收工前请到“设置 → 数据备份”导出备份。</p>
    </section>

    <!-- ================= 记录 ================= -->
    <section class="page" id="page-list">
      <div class="page-head">
        <h2>采集记录</h2>
        <select id="listDate" aria-label="选择日期"></select>
      </div>
      <div class="summary-line" id="listSummary"></div>
      <div class="records" id="recordList"></div>
      <div class="export-bar">
        <button class="btn" id="btnCsv">导出 CSV</button>
        <button class="btn" id="btnPdf">导出 PDF 日报</button>
      </div>
    </section>

    <!-- ================= 统计 ================= -->
    <section class="page" id="page-stats">
      <div class="page-head">
        <h2>当日统计</h2>
        <select id="statDate" aria-label="选择日期"></select>
      </div>

      <div class="stat-hero" id="statHero">
        <div><b id="statTotal">0</b><span>头 / 只</span></div>
        <div><b id="statFamilies">0</b><span>科</span></div>
        <div><b id="statGenera">0</b><span>属</span></div>
        <div><b id="statSpecies">0</b><span>种</span></div>
      </div>

      <div class="card">
        <h3>各科汇总</h3>
        <div class="table-wrap"><table class="tbl" id="familyTable"></table></div>
      </div>

      <div class="card">
        <h3>物种明细</h3>
        <div class="table-wrap"><table class="tbl" id="speciesTable"></table></div>
      </div>

      <div class="actions">
        <button class="btn primary" id="btnReport">生成日报 PDF</button>
        <button class="btn danger" id="btnEnd">结束本次采集</button>
      </div>
      <p class="footnote">“结束采集”只结束计时并生成日报，不会删除任何记录。</p>
    </section>

    <!-- ================= 设置 ================= -->
    <section class="page" id="page-settings">
      <div class="page-head"><h2>设置</h2><span class="muted" id="verLabel"></span></div>
      <div id="settingsBody"></div>
    </section>

  </main>

  <div class="session-bar" id="sessionBar" hidden>
    <div class="sb-info"><b id="sbTotal">0</b><span>头</span><i id="sbTaxa">0 科 · 0 属 · 0 种</i></div>
    <button id="sbAdd">＋ 记录</button>
  </div>

  <nav class="tabbar" aria-label="主导航">
    <button data-tab="collect" class="active">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <span>采集</span>
    </button>
    <button data-tab="list">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>记录</span>
    </button>
    <button data-tab="stats">
      <svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
      <span>统计</span>
    </button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.2"/><circle cx="15" cy="17" r="2.2"/></svg>
      <span>设置</span>
    </button>
  </nav>

</div>

<!-- 弹层 -->
<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <h3 id="sheetTitle">标题</h3>
      <button class="icon-btn" id="sheetClose" aria-label="关闭">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast" hidden>
  <span id="toastMsg"></span>
  <button id="toastAction" hidden>撤销</button>
</div>

<div id="printArea" aria-hidden="true"></div>

<script src="taxonomy-data.js"></script>
<script src="app.js"></script>
</body>
</html>
